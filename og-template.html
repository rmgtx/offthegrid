<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #0B1426;
    display: flex;
    overflow: hidden;
    position: relative;
  }
  /* Subtle grid */
  .grid-bg {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image:
      linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
    background-size: 50px 50px;
  }
  /* Glow */
  .glow-1 {
    position: absolute;
    top: -60px;
    left: -80px;
    width: 500px;
    height: 500px;
    background: rgba(245, 158, 11, 0.08);
    border-radius: 50%;
    filter: blur(100px);
  }
  .glow-2 {
    position: absolute;
    bottom: -100px;
    right: -50px;
    width: 400px;
    height: 400px;
    background: rgba(56, 189, 248, 0.06);
    border-radius: 50%;
    filter: blur(100px);
  }
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 72px 80px;
    flex: 1;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.2);
    border-radius: 8px;
    padding: 8px 16px;
    margin-bottom: 28px;
    width: fit-content;
  }
  .badge span {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #F59E0B;
  }
  h1 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 72px;
    color: white;
    line-height: 1.05;
    margin-bottom: 20px;
    max-width: 700px;
  }
  h1 em {
    color: #F59E0B;
    font-style: italic;
  }
  p {
    font-family: 'DM Sans', sans-serif;
    font-size: 22px;
    color: rgba(255,255,255,0.55);
    line-height: 1.5;
    max-width: 560px;
  }
  /* Right side feature pills */
  .features {
    position: absolute;
    right: 72px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px 24px;
    width: 240px;
    backdrop-filter: blur(8px);
  }
  .feature-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: rgba(245, 158, 11, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .feature-icon svg {
    width: 22px;
    height: 22px;
  }
  .feature-label {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: white;
  }
  .feature-desc {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    margin-top: 2px;
  }
  /* Sun icon in bottom-left */
  .sun-mark {
    position: absolute;
    bottom: 40px;
    left: 80px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sun-mark svg {
    width: 28px;
    height: 28px;
  }
  .sun-mark span {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="content">
    <div class="badge">
      <span>Government-Backed Program</span>
    </div>
    <h1>Never Lose<br>Power <em>Again.</em></h1>
    <p>Up to 12 whole-home backup batteries at no cost. Solar with no out-of-pocket expense. For Texas homeowners.</p>
  </div>

  <div class="features">
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="7" width="12" height="14" rx="2"/><line x1="10" y1="3" x2="10" y2="7"/><line x1="14" y1="3" x2="14" y2="7"/><line x1="10" y1="17" x2="10" y2="13"/><line x1="14" y1="17" x2="14" y2="13"/></svg>
      </div>
      <div>
        <div class="feature-label">12 Batteries</div>
        <div class="feature-desc">Whole-home backup</div>
      </div>
    </div>
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div>
        <div class="feature-label">$0 Cost</div>
        <div class="feature-desc">No out-of-pocket</div>
      </div>
    </div>
    <div class="feature">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <div>
        <div class="feature-label">Save Monthly</div>
        <div class="feature-desc">Lower than utility</div>
      </div>
    </div>
  </div>

  <div class="sun-mark">
    <svg viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="6" fill="#F59E0B"/>
      <line x1="16" y1="4" x2="16" y2="7" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="25" x2="16" y2="28" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="16" x2="7" y2="16" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="16" x2="28" y2="16" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="7.5" y1="7.5" x2="9.6" y2="9.6" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="22.4" y1="22.4" x2="24.5" y2="24.5" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="24.5" y1="7.5" x2="22.4" y2="9.6" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <line x1="9.6" y1="22.4" x2="7.5" y2="24.5" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span>Texas Home Energy Program</span>
  </div>
</body>
</html>
